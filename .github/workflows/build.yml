name: Package Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: reproducible package build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: python -m pip install "build==1.6.0" "twine==7.0.0"

      - name: Set reproducible build epoch
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build twice outside the source tree
        run: |
          rm -rf /tmp/erpchaos-dist-a /tmp/erpchaos-dist-b
          python -m build --outdir /tmp/erpchaos-dist-a
          python -m build --outdir /tmp/erpchaos-dist-b

      - name: Validate package metadata
        run: |
          python -m twine check /tmp/erpchaos-dist-a/*
          python -m twine check /tmp/erpchaos-dist-b/*

      - name: Prove wheel bytes and sdist contents are reproducible
        shell: bash
        run: |
          set -euo pipefail
          cmp /tmp/erpchaos-dist-a/*.whl /tmp/erpchaos-dist-b/*.whl
          rm -rf /tmp/sdist-a /tmp/sdist-b
          mkdir -p /tmp/sdist-a /tmp/sdist-b
          tar -xzf /tmp/erpchaos-dist-a/*.tar.gz -C /tmp/sdist-a
          tar -xzf /tmp/erpchaos-dist-b/*.tar.gz -C /tmp/sdist-b
          diff -ruN /tmp/sdist-a /tmp/sdist-b
          sha256sum /tmp/erpchaos-dist-a/*

      - name: Install built wheel in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/erpchaos-package-test
          /tmp/erpchaos-package-test/bin/python -m pip install /tmp/erpchaos-dist-a/*.whl
          /tmp/erpchaos-package-test/bin/erpchaos --help >/dev/null
          /tmp/erpchaos-package-test/bin/python - <<'PY'
          import erpchaos
          assert erpchaos.__version__ == "0.14.0a0"
          PY

      - name: Prepare build artifact
        run: |
          mkdir -p dist
          cp /tmp/erpchaos-dist-a/* dist/
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: erpchaos-package
          path: dist/
          if-no-files-found: error
          retention-days: 7
