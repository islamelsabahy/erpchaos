name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Tests
        run: pytest --cov=erpchaos --cov-report=term-missing
      - name: Smoke test BRC verification
        run: erpchaos verify examples/real-estate/property-sale.brc.yaml examples/real-estate/healthy-state.yaml
      - name: Smoke test chaos replay
        run: erpchaos chaos run examples/real-estate/duplicate-payment.scenario.yaml examples/real-estate/property-sale.events.yaml
      - name: Smoke test duplicate-payment detection
        shell: bash
        run: |
          set +e
          erpchaos experiment run \
            examples/real-estate/property-sale.events.brc.yaml \
            examples/real-estate/duplicate-payment.scenario.yaml \
            examples/real-estate/property-sale.events.yaml
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Expected duplicate-payment invariant failure exit code 1, got $status"
            exit 1
          fi
      - name: Smoke test ordering failure detection
        shell: bash
        run: |
          set +e
          erpchaos experiment run \
            examples/real-estate/property-sale.events.brc.yaml \
            examples/real-estate/early-payment.scenario.yaml \
            examples/real-estate/property-sale.events.yaml
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Expected ordering invariant failure exit code 1, got $status"
            exit 1
          fi
      - name: Smoke test safe concurrency
        run: erpchaos concurrency run examples/real-estate/single-winner.concurrent.yaml
      - name: Smoke test double-reservation detection
        shell: bash
        run: |
          set +e
          erpchaos concurrency run \
            examples/real-estate/double-reservation.concurrent.yaml
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Expected concurrency exclusivity failure exit code 1, got $status"
            exit 1
          fi
      - name: Smoke test safe Odoo translation
        run: |
          erpchaos adapter odoo translate \
            examples/odoo/property-sale.export.yaml \
            --output /tmp/odoo-event-streams.yaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          from erpchaos.events import EventStream

          text = Path('/tmp/odoo-event-streams.yaml').read_text(encoding='utf-8')
          document = yaml.safe_load(text)
          assert document['schema'] == 'erpchaos.event-stream-export.v1'
          assert 'DEMO-SALE-001' not in text
          for stream in document['streams']:
              EventStream.model_validate(stream)
          PY
      - name: Smoke test incident sanitization
        env:
          ERPCHAOS_PSEUDONYM_KEY: synthetic-ci-pseudonym-key-12345
        run: |
          erpchaos incident sanitize \
            examples/incidents/property-sale.raw.synthetic.yaml \
            examples/incidents/property-sale.policy.yaml \
            --output /tmp/property-sale.safe.yaml
          erpchaos incident validate /tmp/property-sale.safe.yaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          from erpchaos.events import EventStream

          text = Path('/tmp/property-sale.safe.yaml').read_text(encoding='utf-8')
          assert 'INCIDENT-SALE-001' not in text
          assert 'alice@example.test' not in text
          assert '+20 100 000 0000' not in text
          assert 'synthetic-secret-value' not in text
          EventStream.model_validate(yaml.safe_load(text))
          PY

  action-smoke:
    name: composite action contract
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Action verify pass
        id: verify-pass
        uses: ./
        with:
          mode: verify
          contract: examples/real-estate/property-sale.brc.yaml
          state: examples/real-estate/healthy-state.yaml

      - name: Assert pass outputs
        env:
          STATUS: ${{ steps.verify-pass.outputs.status }}
          EXIT_CODE: ${{ steps.verify-pass.outputs.exit-code }}
        run: |
          test "$STATUS" = "PASS"
          test "$EXIT_CODE" = "0"

      - name: Action business failure
        id: business-failure
        continue-on-error: true
        uses: ./
        with:
          mode: experiment
          contract: examples/real-estate/property-sale.events.brc.yaml
          scenario: examples/real-estate/duplicate-payment.scenario.yaml
          stream: examples/real-estate/property-sale.events.yaml

      - name: Assert business failure contract
        env:
          OUTCOME: ${{ steps.business-failure.outcome }}
          STATUS: ${{ steps.business-failure.outputs.status }}
          EXIT_CODE: ${{ steps.business-failure.outputs.exit-code }}
        run: |
          test "$OUTCOME" = "failure"
          test "$STATUS" = "BUSINESS_FAILURE"
          test "$EXIT_CODE" = "1"

      - name: Action invalid input
        id: invalid-input
        continue-on-error: true
        uses: ./
        with:
          mode: verify
          contract: examples/real-estate/property-sale.brc.yaml

      - name: Assert invalid-input contract
        env:
          OUTCOME: ${{ steps.invalid-input.outcome }}
          STATUS: ${{ steps.invalid-input.outputs.status }}
          EXIT_CODE: ${{ steps.invalid-input.outputs.exit-code }}
        run: |
          test "$OUTCOME" = "failure"
          test "$STATUS" = "INVALID_INPUT"
          test "$EXIT_CODE" = "2"
