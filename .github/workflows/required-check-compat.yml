name: Required Check Compatibility

on:
  pull_request:

permissions:
  contents: read

jobs:
  required-evidence-check:
    name: evidence byte consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify deterministic evidence bytes
        run: |
          for output in /tmp/repair-evidence-a.json /tmp/repair-evidence-b.json; do
            erpchaos repair synthesize \
              examples/real-estate/payment-effect.brc.yaml \
              examples/real-estate/duplicate-payment.scenario.yaml \
              examples/real-estate/property-sale.events.yaml \
              examples/real-estate/payment-lineage-recovery.brc.yaml \
              examples/real-estate/payment-repair.catalog.yaml \
              --effect-map examples/real-estate/property-sale.effects.yaml \
              --lineage-policy examples/real-estate/property-sale.lineage.yaml \
              --evidence "$output"
            erpchaos evidence verify "$output"
          done
          cmp /tmp/repair-evidence-a.json /tmp/repair-evidence-b.json
          sha256sum /tmp/repair-evidence-a.json /tmp/repair-evidence-b.json
      - name: Verify deterministic specification report bytes
        run: |
          erpchaos spec compare \
            examples/real-estate/property-sale.effects.yaml \
            examples/spec/property-sale.effects.additive.yaml \
            --json > /tmp/spec-compatibility-a.json
          erpchaos spec compare \
            examples/real-estate/property-sale.effects.yaml \
            examples/spec/property-sale.effects.additive.yaml \
            --json > /tmp/spec-compatibility-b.json
          cmp /tmp/spec-compatibility-a.json /tmp/spec-compatibility-b.json
          sha256sum /tmp/spec-compatibility-a.json /tmp/spec-compatibility-b.json
