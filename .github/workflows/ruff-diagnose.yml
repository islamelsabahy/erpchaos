name: Ruff Diagnose

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff==0.16.6"
      - name: Show canonical Ruff diff
        run: |
          ruff check --fix src/erpchaos/sarif.py
          git diff -- src/erpchaos/sarif.py
