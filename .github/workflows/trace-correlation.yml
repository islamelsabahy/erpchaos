name: Trace Correlation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  generate:
    name: trace determinism (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate canonical transaction trace
        run: |
          erpchaos trace validate \
            examples/traces/property-sale.trace.yaml \
            --json > /tmp/trace-diagnostics.json
      - name: Project deterministic EventStream
        run: |
          erpchaos trace project \
            examples/traces/property-sale.trace.yaml \
            --output /tmp/property-sale.events.yaml \
            --diagnostics /tmp/project-diagnostics.json
          cmp /tmp/trace-diagnostics.json /tmp/project-diagnostics.json
      - name: Translate sanitized offline OTLP export
        run: |
          erpchaos trace from-otel \
            examples/traces/property-sale.otel.json \
            --output /tmp/property-sale.otel.trace.yaml \
            --diagnostics /tmp/property-sale.otel-diagnostics.json
          erpchaos trace validate \
            /tmp/property-sale.otel.trace.yaml \
            --json > /tmp/property-sale.otel-validation.json
          cmp \
            /tmp/property-sale.otel-diagnostics.json \
            /tmp/property-sale.otel-validation.json
      - name: Assert trace contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          diagnostics = json.loads(Path('/tmp/trace-diagnostics.json').read_text(encoding='utf-8'))
          assert diagnostics['schema'] == 'erpchaos.trace-diagnostics.v1'
          assert diagnostics['valid'] is True
          assert diagnostics['ordered_event_ids'] == [
              'crm-reservation-001',
              'finance-approval-001',
              'accounting-payment-001',
              'erp-contract-001',
              'erp-unit-sold-001',
          ]

          stream = yaml.safe_load(Path('/tmp/property-sale.events.yaml').read_text(encoding='utf-8'))
          assert stream['transaction_id'] == 'property-sale-001'
          assert [event['event_id'] for event in stream['events']] == diagnostics['ordered_event_ids']

          otel_trace = yaml.safe_load(
              Path('/tmp/property-sale.otel.trace.yaml').read_text(encoding='utf-8')
          )
          assert otel_trace['schema'] == 'erpchaos.transaction-trace.v1'
          assert otel_trace['trace_id'] == 'otel-trace-demo-001'
          assert otel_trace['transaction_id'] == 'property-sale-otel-001'
          serialized = json.dumps(otel_trace, sort_keys=True)
          assert 'ignored-by-adapter' not in serialized
          PY
      - name: Upload deterministic trace artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trace-correlation-${{ matrix.python-version }}
          path: |
            /tmp/trace-diagnostics.json
            /tmp/property-sale.events.yaml
            /tmp/property-sale.otel.trace.yaml
            /tmp/property-sale.otel-diagnostics.json
          if-no-files-found: error
          retention-days: 7

  consistency:
    name: trace byte consistency
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download trace artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: trace-correlation-*
          path: trace
          merge-multiple: false
      - name: Compare Python 3.11 and 3.12 trace artifacts
        run: |
          for file in \
            trace-diagnostics.json \
            property-sale.events.yaml \
            property-sale.otel.trace.yaml \
            property-sale.otel-diagnostics.json; do
            cmp \
              "trace/trace-correlation-3.11/$file" \
              "trace/trace-correlation-3.12/$file"
          done
          sha256sum trace/trace-correlation-*/*
