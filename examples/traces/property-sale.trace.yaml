schema: erpchaos.transaction-trace.v1
trace_id: synthetic-property-sale-001
transaction_id: property-sale-001
events:
  - event_id: crm-reservation-001
    event_type: reservation.created
    transaction_id: property-sale-001
    source_system: crm
    sequence: 10
    payload:
      unit_ref: UNIT-DEMO-203
  - event_id: finance-approval-001
    event_type: finance.approved
    transaction_id: property-sale-001
    source_system: finance
    sequence: 20
    parent_event_id: crm-reservation-001
    causation_event_id: crm-reservation-001
    payload:
      approval_ref: APPROVAL-DEMO-001
  - event_id: accounting-payment-001
    event_type: payment.received
    transaction_id: property-sale-001
    source_system: accounting
    sequence: 30
    parent_event_id: finance-approval-001
    causation_event_id: finance-approval-001
    payload:
      amount_minor: 2500000
      currency: EGP
  - event_id: erp-contract-001
    event_type: contract.signed
    transaction_id: property-sale-001
    source_system: erp
    sequence: 40
    parent_event_id: accounting-payment-001
    causation_event_id: accounting-payment-001
    payload:
      contract_ref: CONTRACT-DEMO-001
  - event_id: erp-unit-sold-001
    event_type: unit.sold
    transaction_id: property-sale-001
    source_system: erp
    sequence: 50
    parent_event_id: erp-contract-001
    causation_event_id: erp-contract-001
    payload:
      unit_ref: UNIT-DEMO-203
